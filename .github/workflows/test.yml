name: tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test-cpu:
    name: unittest cpu-only
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ffmpeg (sanity audio_preprocess)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Install dependencies (no audio heavy)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyyaml httpx
          # No instalamos faster-whisper/torch en CI (binarios pesados, no necesario para suite)

      - name: Run unittest discover
        env:
          DEPLOYMENT_PROFILE: demo
          AUDIT_HMAC_KEY: ci-test-secret
        run: |
          python -m unittest discover -s tests -p "test_*.py" -v

      - name: Verify audit_verify CLI
        env:
          AUDIT_HMAC_KEY: ci-test-secret
          AUDIT_LOG_PATH: /tmp/empty_audit.jsonl
        run: |
          python scripts/audit_verify.py

  frontend-build:
    name: frontend-demo lint+build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend-demo

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend-demo/package-lock.json

      - name: npm ci
        run: npm ci

      - name: build
        run: npm run build
